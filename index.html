<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="古文トレ">
<meta name="theme-color" content="#f3ecdc">
<title>古文トレーニング</title>
<style>
:root{--paper:#f3ecdc;--card:#fbf6ea;--ink:#2a2521;--sub:#776c5f;--line:#cdbf9f;--shu:#c0392b;--shu-soft:#f3d6cf;--ai:#2c4a66;--ai-soft:#dbe3ea;--gold:#a8842c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
 background-image:radial-gradient(rgba(120,100,60,.05) 1px,transparent 1px);background-size:6px 6px}
button{font-family:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px)}
h1{font-size:28px;letter-spacing:.2em;margin:8px 0 4px;text-align:center;font-weight:800}
.tagline{text-align:center;color:var(--sub);font-size:13px;margin-bottom:14px}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin:6px 0 14px}
.bar b{color:var(--ink);font-size:16px}
.btn{border:1.5px solid var(--ink);background:var(--card);border-radius:10px;padding:10px 14px;font-size:15px;font-weight:700}
.btn.small{padding:6px 10px;font-size:13px;font-weight:600;border-width:1px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.shu{border-color:var(--shu);color:var(--shu)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.frame{position:relative;aspect-ratio:1;border:1.5px solid var(--ink);border-radius:6px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:17px;padding:4px}
.frame small{font-size:11px;color:var(--sub);font-weight:600}
.frame.locked{opacity:.45;border-style:dashed}
.frame .dots{display:flex;gap:4px}
.frame .dots i{width:8px;height:8px;border-radius:50%;border:1px solid var(--shu)}
.frame .dots i.on{background:var(--shu)}
.hanko{position:absolute;inset:14%;border:3px solid var(--shu);border-radius:10px;color:var(--shu);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;letter-spacing:.05em;transform:rotate(-10deg);background:rgba(251,246,234,.75);writing-mode:vertical-rl}
.scroll{margin:16px 0;padding:18px;border:2px solid var(--gold);background:linear-gradient(#fffaf0,#f6ecd4);text-align:center;border-radius:4px;font-size:26px;font-weight:900;letter-spacing:.3em;color:var(--shu)}
.note{font-size:12px;color:var(--sub);line-height:1.7;margin-top:14px}
.head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.head .t{flex:1;font-weight:800;font-size:17px}
.head .n{font-size:13px;color:var(--sub)}
.back{border:none;background:none;font-size:24px;padding:8px 14px 8px 4px;min-width:48px;min-height:44px;text-align:left}
#dlg{position:fixed;inset:0;background:rgba(42,37,33,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:24px}
#dlg.on{display:flex}
#dlg .box{background:var(--card);border:1.5px solid var(--ink);border-radius:12px;padding:20px;max-width:340px;width:100%}
#dlg .msg{font-size:16px;font-weight:700;line-height:1.7;margin-bottom:16px}
#dlg .row{display:flex;gap:10px}
#dlg .row .btn{flex:1}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1.5px solid var(--ink);border-radius:12px;background:var(--card);padding:14px;margin-bottom:10px}
.mode .num{font-size:26px;font-weight:900;color:var(--ai);width:32px;text-align:center}
.mode .mt{font-weight:800;font-size:17px}
.mode .md{font-size:12px;color:var(--sub);margin-top:2px}
.mode .st{margin-left:auto;font-size:13px;font-weight:800}
.mode .st.done{color:var(--shu)}
.mode.locked{opacity:.4;border-style:dashed}
.streak{text-align:right;font-size:12px;color:var(--sub);margin:-6px 0 8px}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:12px;padding:16px;margin-bottom:14px}
.lbl{display:inline-block;font-size:11px;font-weight:800;color:var(--paper);background:var(--ai);border-radius:4px;padding:2px 8px;margin-bottom:8px}
.lbl.shu{background:var(--shu)}
.q{font-size:18px;line-height:1.7;font-weight:700}
.verb{font-size:40px;font-weight:900;text-align:center;margin:6px 0 4px;letter-spacing:.1em}
.prompt{font-size:15px;font-weight:700;margin:4px 0 10px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices.two{grid-template-columns:1fr}
.ch{border:1.5px solid var(--ink);background:var(--card);border-radius:10px;min-height:56px;font-size:20px;font-weight:800;padding:8px}
.ch.right{background:var(--shu);border-color:var(--shu);color:#fff}
.ch.bad{background:#ddd5c4;color:var(--sub);text-decoration:line-through}
.ch:disabled{opacity:1}
.fb{margin-top:12px;font-size:15px;line-height:1.7;padding:10px 12px;border-radius:8px;background:var(--ai-soft)}
.fb.ng{background:var(--shu-soft)}
.fb b{color:var(--shu)}
.done0{font-size:14px;margin:0 0 10px;padding:6px 10px;border-radius:6px;background:var(--ai-soft)}
.done0.ng{background:var(--shu-soft)}
.next{display:block;width:100%;margin-top:14px}
table.kt{width:100%;border-collapse:collapse;table-layout:fixed;background:#fffaf0;margin-bottom:12px}
.kt th,.kt td{border:1px solid var(--line);text-align:center;padding:5px 0;word-break:break-all}
.kt th{font-size:11px;font-weight:700;background:var(--ai-soft);color:var(--ai)}
.kt td.sub{font-size:9px;color:var(--sub);padding:3px 0;line-height:1.2}
.kt td.v{font-size:17px;font-weight:800;height:44px}
.kt td.kihon{font-size:14px;background:var(--ai-soft)}
.kt td.cur{background:var(--shu-soft);outline:2px solid var(--shu);outline-offset:-2px;color:var(--shu)}
.kt td.miss{color:var(--shu)}
.cellmsg{font-size:14px;min-height:22px;color:var(--shu);font-weight:700;margin-bottom:6px}
.tatewrap{display:flex;justify-content:center;margin-bottom:8px}
.tate{writing-mode:vertical-rl;height:250px;font-size:23px;line-height:2.3;padding:14px 18px;background:#fffaf0;border:1px solid var(--line);border-radius:6px;letter-spacing:.06em}
.tate u{text-decoration:underline 2px var(--shu);text-underline-position:right;text-underline-offset:4px;color:var(--shu);font-weight:800}
.tate rt{font-size:10px}
.src{text-align:center;font-size:12px;color:var(--sub);margin-bottom:8px}
.tr{font-size:14px;line-height:1.7;background:#fffaf0;border:1px dashed var(--line);border-radius:6px;padding:8px 10px;margin-bottom:12px}
.center{text-align:center}
.big{font-size:22px;font-weight:900;margin:24px 0 8px}
#fx{position:fixed;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:10}
.maru{width:170px;height:170px;border:12px solid var(--shu);border-radius:50%;opacity:0;animation:maru .7s ease-out}
@keyframes maru{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.05);opacity:.85}100%{transform:scale(1);opacity:0}}
.fude{font-size:84px;font-weight:900;color:var(--shu);writing-mode:vertical-rl;letter-spacing:.1em;text-shadow:2px 2px 0 rgba(0,0,0,.08);opacity:0;animation:fude 1.6s ease-out}
@keyframes fude{0%{transform:scale(1.6);opacity:0}20%{transform:scale(1);opacity:1}75%{opacity:1}100%{opacity:0}}
.frame .hanko{inset:auto;right:4px;bottom:4px;width:44%;height:44%;font-size:13px;border-width:2px;border-radius:6px}
.stampbig{position:relative;width:150px;height:150px;margin:18px auto}
.stampbig .hanko{inset:0;font-size:52px;border-width:6px;animation:stamp .5s ease-out}
@keyframes stamp{0%{transform:scale(2) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(-10deg);opacity:1}}
.set{display:flex;flex-direction:column;gap:10px}
input[type=file]{display:none}
.choices.many{grid-template-columns:1fr 1fr}
.choices.many .ch{min-height:48px;font-size:15px!important}
.yomi{font-size:18px;color:var(--sub);font-weight:700;letter-spacing:0}
.patcard{font-size:13px;line-height:1.8;background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin-bottom:12px}
.patcard b{color:var(--shu);font-size:15px}
.tag{display:inline-block;font-size:11px;color:var(--ai);border:1px solid var(--ai);border-radius:4px;padding:1px 6px;margin-bottom:8px}

</style>
</head>
<body>
<div id="app"></div>
<div id="fx"></div>
<div id="dlg"><div class="box"><div class="msg"></div><div class="row"></div></div></div>
<input type="file" id="imp" accept="application/json,.json">
<script>
/* ====== 基本データ ====== */
const ROWS={'ア':'あいうえお','カ':'かきくけこ','ガ':'がぎぐげご','サ':'さしすせそ','ザ':'ざじずぜぞ','タ':'たちつてと','ダ':'だぢづでど','ナ':'なにぬねの','ハ':'はひふへほ','バ':'ばびぶべぼ','マ':'まみむめも','ヤ':'やいゆえよ','ラ':'らりるれろ','ワ':'わゐうゑを'};
const ALL_GYO=Object.keys(ROWS);
const DAN=['a段','i段','u段','e段','o段'];
const FORMS=['未然形','連用形','終止形','連体形','已然形','命令形'];
const SETSUGO=['ず・む','たり・て','。','とき・こと','ど・ども','。'];
const TYPES=[
 {id:'yodan',name:'四段',full:'四段活用',pat:[[0],[1],[2],[2],[3],[3]],zd:0,patTxt:'a・i・u・u・e・e'},
 {id:'shimo2',name:'下二段',full:'下二段活用',pat:[[3],[3],[2],[2,'る'],[2,'れ'],[3,'よ']],zd:3,patTxt:'e・e・u・uる・uれ・eよ'},
 {id:'kami2',name:'上二段',full:'上二段活用',pat:[[1],[1],[2],[2,'る'],[2,'れ'],[1,'よ']],zd:1,patTxt:'i・i・u・uる・uれ・iよ'},
 {id:'kami1',name:'上一段',full:'上一段活用',pat:[[1],[1],[1,'る'],[1,'る'],[1,'れ'],[1,'よ']],zd:1,patTxt:'i・i・iる・iる・iれ・iよ',memo:'ひ・い・き・に・み・ゐる（干る・射る・鋳る・着る・煮る・似る・見る・居る・率る など）'},
 {id:'shimo1',name:'下一段',full:'下一段活用',pat:[[3],[3],[3,'る'],[3,'る'],[3,'れ'],[3,'よ']],zd:3,patTxt:'e・e・eる・eる・eれ・eよ',memo:'蹴る（一語だけ）'},
 {id:'ka',name:'カ変',full:'カ行変格活用',fixed:['こ','き','く','くる','くれ','こ（よ）'],zd:4,patTxt:'o・i・u・uる・uれ・o（よ）',memo:'来（一語だけ）'},
 {id:'sa',name:'サ変',full:'サ行変格活用',pat:[[3],[1],[2],[2,'る'],[2,'れ'],[3,'よ']],zd:3,patTxt:'e・i・u・uる・uれ・eよ',memo:'す・おはす（二語だけ）'},
 {id:'na',name:'ナ変',full:'ナ行変格活用',pat:[[0],[1],[2],[2,'る'],[2,'れ'],[3]],zd:0,patTxt:'a・i・u・uる・uれ・e',memo:'死ぬ・往ぬ（去ぬ）（二語だけ）'},
 {id:'ra',name:'ラ変',full:'ラ行変格活用',pat:[[0],[1],[1],[2],[3],[3]],zd:0,patTxt:'a・i・i・u・e・e',memo:'あり・居り・侍り・いまそかり（四語だけ）'}];
const TIDX={};TYPES.forEach((T,i)=>TIDX[T.id]=i);
const MODES=[
 {id:'h',name:'判別',desc:'暗記語 →「ず」を付けて活用の種類を見分ける'},
 {id:'t',name:'活用表',desc:'語幹・六つの活用形・行を一マスずつ埋める'},
 {id:'k',name:'基本形',desc:'古文の傍線部から基本形を答える'}];
const UNLEARNED='まだ習っていない活用';

function formsOf(T,row){
 if(T.fixed) return T.fixed.slice();
 const R=ROWS[row];return T.pat.map(([i,s])=>R[i]+(s||''));
}

/* ====== 判別用の動詞（表示:語幹の前部分:行:読み:補足） ====== */
const HB_SRC={
yodan:`書く:書:カ 仰ぐ:仰:ガ:あふぐ 隠す:隠:サ 持つ:持:タ 言ふ:言:ハ 遊ぶ:遊:バ 読む:読:マ 狩る:狩:ラ 泣く:泣:カ 散らす:散ら:サ 待つ:待:タ 笑ふ:笑:ハ 呼ぶ:呼:バ 住む:住:マ 足る:足:ラ:たる 思ふ:思:ハ 飽く:飽:カ:あく 動く:動:カ 驚く:驚:カ 聞く:聞:カ 嘆く:嘆:カ 急ぐ:急:ガ 泳ぐ:泳:ガ 漕ぐ:漕:ガ 騒ぐ:騒:ガ 脱ぐ:脱:ガ 起こす:起こ:サ 指す:指:サ 過ごす:過ご:サ 話す:話:サ 誤つ:誤:タ:あやまつ 討つ:討:タ 勝つ:勝:タ 保つ:保:タ 放つ:放:タ 疑ふ:疑:ハ 食ふ:食:ハ:くふ 使ふ:使:ハ 養ふ:養:ハ 酔ふ:酔:ハ 転ぶ:転:バ:ころぶ 飛ぶ:飛:バ 学ぶ:学:バ 結ぶ:結:バ 組む:組:マ 好む:好:マ 富む:富:マ 望む:望:マ 踏む:踏:マ 借る:借:ラ:かる 取る:取:ラ 乗る:乗:ラ 走る:走:ラ 光る:光:ラ`,
shimo2:`得::ア:う 明く:明:カ:あく 投ぐ:投:ガ:なぐ 失す:失:サ:うす 混ず:混:ザ:まず 捨つ:捨:タ:すつ 愛づ:愛:ダ:めづ 連ぬ:連:ナ:つらぬ 憂ふ:憂:ハ:うれふ 比ぶ:比:バ:くらぶ 集む:集:マ:あつむ 聞こゆ:聞こ:ヤ 恐る:恐:ラ:おそる 植う:植:ワ:うう 心得:心:ア:こころう:「得」の複合動詞 見ゆ:見:ヤ:みゆ 据う:据:ワ:すう 預く:預:カ:あづく 受く:受:カ:うく 避く:避:カ:さく 助く:助:カ:たすく 負く:負:カ:まく 上ぐ:上:ガ:あぐ 下ぐ:下:ガ:さぐ 捧ぐ:捧:ガ:ささぐ 告ぐ:告:ガ:つぐ 遂ぐ:遂:ガ:とぐ 褪す:褪:サ:あす 似す:似:サ:にす 任す:任:サ:まかす 痩す:痩:サ:やす 当つ:当:タ:あつ 慌つ:慌:タ:あわつ 企つ:企:タ:くはだつ 果つ:果:タ:はつ 出づ:出:ダ:いづ 撫づ:撫:ダ:なづ 詣づ:詣:ダ:まうづ 罷づ:罷:ダ:まかづ 重ぬ:重:ナ:かさぬ 兼ぬ:兼:ナ:かぬ 尋ぬ:尋:ナ:たづぬ 寝::ナ:ぬ 跳ぬ:跳:ナ:はぬ 与ふ:与:ハ:あたふ 答ふ:答:ハ:こたふ 経::ハ:ふ 迎ふ:迎:ハ:むかふ 教ふ:教:ハ:をしふ 調ぶ:調:バ:しらぶ 統ぶ:統:バ:すぶ 食ぶ:食:バ:たぶ 述ぶ:述:バ:のぶ 定む:定:マ:さだむ 攻む:攻:マ:せむ 眺む:眺:マ:ながむ 始む:始:マ:はじむ 求む:求:マ:もとむ 覚ゆ:覚:ヤ:おぼゆ 消ゆ:消:ヤ:きゆ 越ゆ:越:ヤ:こゆ 絶ゆ:絶:ヤ:たゆ 荒る:荒:ラ:ある 訪る:訪:ラ:おとづる 隠る:隠:ラ:かくる 枯る:枯:ラ:かる 流る:流:ラ:ながる 飢う:飢:ワ:うう 所得:所:ア:ところう:「得」の複合動詞`,
kami2:`起く:起:カ:おく 凪ぐ:凪:ガ:なぐ 落つ:落:タ:おつ 閉づ:閉:ダ:とづ 生ふ:生:ハ:おふ 侘ぶ:侘:バ:わぶ 恨む:恨:マ:うらむ 報ゆ:報:ヤ:むくゆ 下る:下:ラ:おる 怖づ:怖:ダ:おづ 強ふ:強:ハ:しふ 滅ぶ:滅:バ:ほろぶ 凍む:凍:マ:しむ 悔ゆ:悔:ヤ:くゆ 懲る:懲:ラ:こる 尽く:尽:カ:つく 過ぐ:過:ガ:すぐ 朽つ:朽:タ:くつ 綴づ:綴:ダ:とづ 恥づ:恥:ダ:はづ 恋ふ:恋:ハ:こふ 帯ぶ:帯:バ:おぶ 試む:試:マ:こころむ 老ゆ:老:ヤ:おゆ 古る:古:ラ:ふる`,
kami1:`着る::カ:きる 似る::ナ:にる 煮る::ナ:にる 干る::ハ:ひる 乾る::ハ:ひる 見る::マ:みる 射る::ヤ:いる 鋳る::ヤ:いる 居る::ワ:ゐる 率る::ワ:ゐる 試みる:試:マ:こころみる:「見る」の複合動詞 鑑みる:鑑:マ:かんがみる:「見る」の複合動詞 後見る:うしろ:マ:うしろみる:「見る」の複合動詞 惟みる:惟:マ:おもんみる:「見る」の複合動詞 顧みる:顧:マ:かへりみる:「見る」の複合動詞 率ゐる:率:ワ:ひきゐる:「率る」の複合動詞 用ゐる:用:ワ:もちゐる:「率る」の複合動詞`,
shimo1:`蹴る::カ:ける`,
ka:`来::カ:く 出で来:出で:カ:いでく:「来」の複合動詞 追ひ来:追ひ:カ:おひく:「来」の複合動詞 詣で来:詣で:カ:まうでく:「来」の複合動詞 持て来:持て:カ:もてく:「来」の複合動詞`,
sa:`す::サ おはす:おは:サ 案ず:案:ザ:あんず:「混ず」以外のザ行の動詞はサ変 信ず:信:ザ:しんず:「混ず」以外のザ行の動詞はサ変 愛す:愛:サ:あいす:漢語＋すの複合動詞 心地す:心地:サ:ここちす:名詞＋すの複合動詞 重んず:重ん:ザ:おもんず:形容詞＋すの複合動詞`,
na:`死ぬ:死:ナ:しぬ 往ぬ:往:ナ:いぬ 去ぬ:去:ナ:いぬ 思ひ死ぬ:思ひ死:ナ:おもひしぬ:「死ぬ」の複合動詞 恋ひ死ぬ:恋ひ死:ナ:こひしぬ:「死ぬ」の複合動詞`,
ra:`あり:あ:ラ 居り:居:ラ:をり 侍り:侍:ラ:はべり いまそかり:いまそか:ラ かかり:かか:ラ::副詞「かく」＋ありの複合動詞 さり:さ:ラ::副詞「さ」＋ありの複合動詞 しかり:しか:ラ::副詞「しか」＋ありの複合動詞`};

const HB=[];
TYPES.forEach(T=>{
 HB_SRC[T.id].split(/\s+/).filter(Boolean).forEach(spec=>{
  const [k,pre,row,yomi,note]=spec.split(':');
  const R=ROWS[row],idx=T.id==='ka'?[1,2,3,4]:[0,1,2,3];
  HB.push({kind:'hb',id:'h:'+k,tid:T.id,k,yomi:yomi||'',note:note||'',z:pre+R[T.zd]+'ず',zch:idx.map(i=>pre+R[i]+'ず')});
 });
});

/* ====== 活用表の動詞（基本形:語幹:行） 語幹が（ ）なら区別なし ====== */

/* 四段サンプルからのID互換（既存の苦手記録を引き継ぐ） */
const ALL_ITEMS=[].concat(ANKI,HB,TB,KH);
const ITEM_BY_ID={};ALL_ITEMS.forEach(x=>ITEM_BY_ID[x.id]=x);

/* ====== 保存 ====== */
const KEY='kobun-training-v1';
let S={cleared:{},weak:{},streak:0,best:0};
function load(){try{const t=localStorage.getItem(KEY);if(t){const o=JSON.parse(t);S=Object.assign(S,o);}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ====== ユーティリティ ====== */
const app=document.getElementById('app'),fx=document.getElementById('fx');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickN(pool,n){const w=shuffle(pool.filter(x=>S.weak[x.id]!=null)),r=shuffle(pool.filter(x=>S.weak[x.id]==null));return w.concat(r).slice(0,n);}
function uniq(a){return a.filter((x,i)=>x&&a.indexOf(x)===i);}
function modeDone(tid,m){return !!(S.cleared[tid]&&S.cleared[tid][m]);}
function passed(tid){return MODES.every(m=>modeDone(tid,m.id));}
function typeOpen(i){return i===0||passed(TYPES[i-1].id);}
function modeOpen(tid,mi){return mi===0||modeDone(tid,MODES[mi-1].id);}
function weakIds(){return Object.keys(S.weak).filter(id=>ITEM_BY_ID[id]);}
function openedMax(){let m=0;TYPES.forEach((T,i)=>{if(typeOpen(i))m=i;});return m;}
function T_(tid){return TYPES[TIDX[tid]];}

/* ====== 演出 ====== */
function maru(){fx.innerHTML='<div class="maru"></div>';}
function fude(t){fx.innerHTML='<div class="fude">'+t+'</div>';}
const MILESTONES={10:'見事',30:'天晴',50:'神業',100:'達人'};

let screen='home',curType=0,Q=null;
function renderHome(){
 screen='home';
 let h='<h1>古文トレーニング</h1><div class="tagline">動詞の活用 九種</div>';
 const wc=weakIds().length;
 h+=`<div class="bar"><span>連続正解 <b>${S.streak}</b>（最高 ${S.best}）</span><span>苦手 <b>${wc}</b> 問</span><button class="btn small" data-act="settings">設定</button></div>`;
 h+='<div class="grid">';
 TYPES.forEach((T,i)=>{
  const open=typeOpen(i);
  let inner=T.name;
  if(!open) inner+='<small>未開放</small>';
  else inner+='<div class="dots">'+MODES.map(m=>`<i class="${modeDone(T.id,m.id)?'on':''}"></i>`).join('')+'</div>';
  if(passed(T.id)) inner+='<div class="hanko">合格</div>';
  h+=`<button class="frame ${open?'':'locked'}" data-act="type" data-i="${i}" ${open?'':'disabled'}>${inner}</button>`;
 });
 h+='</div>';
 if(wc) h+=`<button class="btn shu next" data-act="review">苦手を復習する（${wc}問）</button>`;
 if(TYPES.every(T=>passed(T.id))) h+='<div class="scroll">免許皆伝</div>';
 h+='<div class="note">教科書の順に、一つの活用ごとに「判別 → 活用表 → 基本形」を終えると合格の判子が押され、次の活用が開きます。間違えた問題は苦手として残り、三回続けて正解すると消えます。</div>';
 app.innerHTML=h;
}

/* ====== 画面：活用の種類 ====== */
function renderType(i){
 screen='type';curType=i;const T=TYPES[i];
 let h=`<div class="head"><button class="back" data-act="home">←</button><div class="t">${T.full}</div></div>`;
 h+=`<div class="patcard">活用語尾：<b>${T.patTxt}</b>${T.memo?`<br>暗記語：${T.memo}`:''}</div>`;
 MODES.forEach((m,mi)=>{
  const open=modeOpen(T.id,mi),done=modeDone(T.id,m.id);
  h+=`<button class="mode ${open?'':'locked'}" data-act="start" data-m="${m.id}" ${open?'':'disabled'}>
   <div class="num">${'一二三'[mi]}</div><div><div class="mt">${m.name}</div><div class="md">${m.desc}</div></div>
   <div class="st ${done?'done':''}">${done?'済':(open?'':'未開放')}</div></button>`;
 });
 if(passed(T.id)) h+='<div class="stampbig"><div class="hanko">合格</div></div>';
 app.innerHTML=h;
}

/* ====== 出題の組み立て ====== */
function buildSession(tid,mode){
 const ti=TIDX[tid];
 if(mode==='h'){
  const anki=shuffle(ANKI.filter(x=>x.tid===tid));
  const om=openedMax();
  const cur=HB.filter(x=>x.tid===tid),prev=HB.filter(x=>TIDX[x.tid]<=om&&x.tid!==tid),un=HB.filter(x=>TIDX[x.tid]>om);
  let rest;
  if(!prev.length) rest=pickN(cur,7).concat(pickN(un,3));
  else rest=pickN(cur,6).concat(pickN(prev,4)).concat(pickN(un,un.length?2:0));
  return anki.concat(shuffle(rest));
 }
 if(mode==='t') return shuffle(pickN(TB.filter(x=>x.tid===tid),4));
 if(mode==='k') return shuffle(KH.filter(x=>x.tid===tid));
}
function startSession(mode){
 const T=TYPES[curType];
 Q={tid:T.id,mode,items:buildSession(T.id,mode),idx:0,wrong:[],round:1,inter:false};
 prep();renderQuiz();
}
function startReview(){
 const ids=shuffle(weakIds()).slice(0,12);
 Q={review:true,mode:'r',items:ids.map(id=>ITEM_BY_ID[id]),idx:0,wrong:[],round:1,inter:false};
 prep();renderQuiz();
}
function cur(){return Q.items[Q.idx];}
function prep(){Q.st={step:0,wrong:false,done:false,msg:'',cellMiss:[],showTr:false,picked:null,picked0:null,ok0:null};buildChoices();}

function hbAnswer(it){return TIDX[it.tid]>openedMax()?UNLEARNED:T_(it.tid).full;}
function hbTypeChoices(){const om=openedMax();const c=TYPES.slice(0,om+1).map(T=>T.full);if(om<TYPES.length-1)c.push(UNLEARNED);return c;}

const CELL_POOL_TYPES=['yodan','shimo2','kami2','kami1','shimo1','sa','na','ra'];
function tableChoices(it,step){
 const corr=it.ans[step],R=ROWS[it.row];
 if(step===0){
  let cand;
  if(corr[0]==='（'){const k=corr.slice(1,-1);cand=[k].concat(R.split('').filter(x=>x!==k).map(x=>'（'+x+'）'));}
  else cand=uniq([it.st+R[2],it.st+R[0],it.st.length>1?it.st.slice(0,-1):'',it.st+R[1],it.st+R[3],'（'+it.st+'）']);
  cand=cand.filter(x=>x!==corr);
  return shuffle([corr].concat(shuffle(cand).slice(0,3)));
 }
 if(step===7){
  const groups=[['ア','ヤ','ワ','ハ'],['ザ','ダ','サ','タ'],['カ','ガ','ア'],['バ','ハ','マ'],['ナ','ラ','マ']];
  const g=groups.find(g=>g.includes(it.row))||[];
  const forced=shuffle(g.filter(x=>x!==it.row)).map(x=>x+'行');
  const rest=shuffle(ALL_GYO.map(x=>x+'行').filter(x=>x!==corr&&!forced.includes(x)));
  return shuffle([corr].concat(forced.concat(rest).slice(0,3)));
 }
 if(corr.includes('（')) return shuffle([corr,'きよ','くれ','けよ']);
 let pool=[];
 CELL_POOL_TYPES.forEach(id=>pool=pool.concat(formsOf(T_(id),it.row)));
 if(it.row==='カ') pool=pool.concat(T_('ka').fixed);
 pool=uniq(pool).filter(x=>x!==corr&&!x.includes('（'));
 const same=shuffle(pool.filter(x=>x.length===corr.length)),diff=shuffle(pool.filter(x=>x.length!==corr.length));
 return shuffle([corr].concat(same.concat(diff).slice(0,3)));
}
function buildChoices(){
 const it=cur(),st=Q.st;
 if(it.kind==='anki'||it.kind==='kh'||it.kind==='yomi') st.choices=shuffle(it.ch);
 else if(it.kind==='hb') st.choices=st.step===0?shuffle(it.zch):hbTypeChoices();
 else if(it.kind==='tb') st.choices=tableChoices(it,st.step);
}
function correctOf(it){
 if(it.kind==='hb') return hbAnswer(it);
 return it.a;
}

/* ====== 出題画面 ====== */
function choicesHTML(){
 const st=Q.st,it=cur();
 const corr=st.done&&it.kind!=='tb'?correctOf(it):null;
 const maxLen=Math.max.apply(null,st.choices.map(c=>c.length));
 const layout=st.choices.length>4?'many':(maxLen>9?'two':'');
 return `<div class="choices ${layout}">`+st.choices.map((c,i)=>{
  let cls='ch';
  if(corr!==null){if(c===corr)cls+=' right';else if(c===st.picked)cls+=' bad';}
  const fs=c.length>9?'font-size:15px':(c.length>5?'font-size:17px':'');
  return `<button class="${cls}" data-act="ch" data-i="${i}" ${st.done?'disabled':''} style="${fs}">${c}</button>`;
 }).join('')+'</div>';
}
function verbLabel(it){return it.yomi&&it.yomi!==it.k?`${it.k}<span class="yomi">（${it.yomi}）</span>`:it.k;}
function hbExplain(it){
 const T=T_(it.tid),ans=hbAnswer(it);
 let s=`「${it.z}」→「ず」の直前が <b>${DAN[T.zd]}</b>。`;
 if(T.memo) s+=`<br>「${it.k}」は <b>${T.full}</b>（暗記語：${T.memo}）`;
 else s+=`<br>→ <b>${T.full}</b>`;
 if(it.note) s+=`<br><small>${it.note}</small>`;
 if(ans===UNLEARNED) s+=`<br><small>（${T.full}はまだ習っていないので「${UNLEARNED}」が正解）</small>`;
 return s;
}
function renderQuiz(){
 screen='quiz';
 const title=Q.review?'苦手の復習':`${TYPES[curType].name}・${MODES.find(m=>m.id===Q.mode).name}`;
 let h=`<div class="head"><button class="back" data-act="quit">←</button><div class="t">${title}</div><div class="n">${Q.round>1?'やり直し ':''}${Q.idx+1} / ${Q.items.length}</div></div>`;
 if(Q.inter){
  h+=`<div class="center"><div class="big">間違えた ${Q.items.length} 問を<br>もう一度</div><p class="note">全部正解するまで続きます。</p><button class="btn primary next" data-act="resume">始める</button></div>`;
  app.innerHTML=h;return;
 }
 h+=`<div class="streak">連続正解 ${S.streak}</div>`;
 const it=cur(),st=Q.st;
 if(Q.review) h+=`<div class="tag">${T_(it.tid).full}</div>`;
 if(it.kind==='anki'){
  h+=`<div class="card"><span class="lbl shu">暗記語</span><div class="q">${it.q}</div></div>`+choicesHTML();
  if(st.done) h+=`<div class="fb ${st.wrong?'ng':''}">${st.wrong?'✕ 正解は「'+it.a+'」。':'○ 正解。'}${it.note}</div>`;
 }
 else if(it.kind==='hb'){
  h+=`<div class="card"><span class="lbl">判別</span><div class="verb">${verbLabel(it)}</div></div>`;
  if(st.step===0){h+=`<div class="prompt">打消の「ず」を付けると？</div>`+choicesHTML();}
  else{
   h+=`<div class="done0 ${st.ok0?'':'ng'}">「ず」を付けると → <b>${it.z}</b>${st.ok0?'　○':'　✕（選んだのは「'+st.picked0+'」）'}</div>`;
   h+=`<div class="prompt">では、活用の種類は？</div>`+choicesHTML();
   if(st.done) h+=`<div class="fb ${st.wrong?'ng':''}">${hbExplain(it)}</div>`;
  }
 }
 else if(it.kind==='tb'){
  h+=tableHTML(it,st);
  if(!st.done){
   const lab=st.step===0?'語幹':st.step===7?'活用する行':FORMS[st.step-1];
   h+=`<div class="cellmsg">${st.msg||''}</div><div class="prompt">「${lab}」は？</div>`+choicesHTML();
  } else {
   const T=T_(it.tid);
   h+=`<div class="fb ${st.wrong?'ng':''}">${st.wrong?'✕ 赤いマスを間違えました。あとでもう一度出ます。':'○ 全部正解。'}<br>${T.full}は <b>${T.patTxt}</b>。${it.st[0]==='（'?'<br>語幹と語尾の区別がない語は、語幹を（ ）で示す。':''}</div>`;
  }
 }
 else if(it.kind==='kh'||it.kind==='yomi'){
  h+=`<div class="tatewrap"><div class="tate">${it.s}</div></div><div class="src">（${it.src}）</div>`;
  h+=st.showTr?`<div class="tr">${it.tr}</div>`:`<div class="center" style="margin-bottom:12px"><button class="btn small" data-act="tr">訳を見る</button></div>`;
  h+=it.kind==='yomi'?`<div class="prompt">傍線部「${it.u}」の読みは？（現代仮名遣い）</div>`:`<div class="prompt">傍線部「${it.u}」の基本形は？</div>`;
  h+=choicesHTML();
  if(st.done) h+=it.kind==='yomi'
   ?`<div class="fb ${st.wrong?'ng':''}">${st.wrong?'✕ ':'○ '}「${it.u}」の読み → <b>${it.a}</b>（${it.form}・${it.type}）</div>`
   :`<div class="fb ${st.wrong?'ng':''}">${st.wrong?'✕ ':'○ '}「${it.u}」→ <b>${it.a}</b>（${it.form}・${it.type}）</div>`;
 }
 if(st.done) h+=`<button class="btn primary next" data-act="next">次へ</button>`;
 app.innerHTML=h;
}
function tableHTML(it,st){
 const heads=['基本形','語幹'].concat(FORMS).concat(['行']);
 let h='<table class="kt"><colgroup><col style="width:15%"><col style="width:12%">'+'<col>'.repeat(7)+'</colgroup>';
 h+='<tr>'+heads.map(x=>`<th>${x.replace('形','<br>形')}</th>`).join('')+'</tr>';
 h+='<tr><td class="sub"></td><td class="sub"></td>'+SETSUGO.map(x=>`<td class="sub">${x}</td>`).join('')+'<td class="sub"></td></tr>';
 h+=`<tr><td class="v kihon" style="${it.k.length>3?'font-size:11px':''}">${it.k}</td>`;
 for(let i=0;i<8;i++){
  let cls='v',val='';
  if(i<st.step){val=it.ans[i];if(st.cellMiss.includes(i))cls+=' miss';}
  else if(i===st.step&&!st.done){cls+=' cur';val='？';}
  const fs=i===7?'font-size:13px':(val.length>3?'font-size:11px':(val.length>2?'font-size:14px':''));
  h+=`<td class="${cls}" style="${fs}">${val}</td>`;
 }
 return h+'</tr></table>';
}

/* ====== 回答処理 ====== */
function choose(i){
 const it=cur(),st=Q.st;if(st.done)return;
 const c=st.choices[i];
 if(it.kind==='tb'){
  const corr=it.ans[st.step];
  if(c!==corr){st.wrong=true;st.cellMiss.push(st.step);st.msg=`✕「${c}」ではなく「${corr}」`;}else st.msg='';
  st.step++;
  if(st.step>=8){st.done=true;finishItem(!st.wrong);}else buildChoices();
  renderQuiz();return;
 }
 if(it.kind==='hb'&&st.step===0){
  st.ok0=c===it.z;st.picked0=c;if(!st.ok0)st.wrong=true;
  st.step=1;buildChoices();renderQuiz();return;
 }
 st.picked=c;if(c!==correctOf(it))st.wrong=true;st.done=true;finishItem(!st.wrong);renderQuiz();
}
function finishItem(ok){
 const it=cur();
 if(ok){
  S.streak++;if(S.streak>S.best)S.best=S.streak;
  if(Q.round===1&&S.weak[it.id]!=null){S.weak[it.id]++;if(S.weak[it.id]>=3)delete S.weak[it.id];}
  if(MILESTONES[S.streak])fude(MILESTONES[S.streak]);else maru();
 }else{
  S.streak=0;S.weak[it.id]=0;Q.wrong.push(it);fx.innerHTML='';
 }
 save();
}
function next(){
 Q.idx++;
 if(Q.idx>=Q.items.length){
  if(Q.wrong.length){Q.items=shuffle(Q.wrong);Q.wrong=[];Q.idx=0;Q.round++;Q.inter=true;renderQuiz();return;}
  return finishSession();
 }
 prep();renderQuiz();
}
function finishSession(){
 if(Q.review){
  const left=weakIds().length;
  app.innerHTML=`<div class="center"><div class="big">復習 おわり</div><p>残りの苦手：${left} 問</p><button class="btn primary next" data-act="home">ホームへ</button></div>`;
  screen='result';Q=null;return;
 }
 const tid=Q.tid,was=passed(tid),wasAll=TYPES.every(T=>passed(T.id));
 S.cleared[tid]=S.cleared[tid]||{};S.cleared[tid][Q.mode]=true;save();
 const nowPass=passed(tid),nowAll=TYPES.every(T=>passed(T.id));
 const mname=MODES.find(m=>m.id===Q.mode).name;
 let h=`<div class="center"><div class="big">${TYPES[curType].name}・${mname}<br>全問正解</div>`;
 if(nowPass&&!was){
  h+='<div class="stampbig"><div class="hanko">合格</div></div><p>'+TYPES[curType].full+'　合格</p>';
  if(curType<TYPES.length-1) h+=`<p class="note">「${TYPES[curType+1].full}」が開きました。</p>`;
 }
 if(nowAll&&!wasAll) h+='<div class="scroll">免許皆伝</div><p>九種すべて合格！</p>';
 h+=`<button class="btn primary next" data-act="totype">戻る</button></div>`;
 screen='result';Q=null;app.innerHTML=h;
}

/* ====== 設定 ====== */
function renderSettings(){
 screen='settings';
 app.innerHTML=`<div class="head"><button class="back" data-act="home">←</button><div class="t">設定</div></div>
 <div class="set">
  <button class="btn" data-act="export">進み具合を書き出す（バックアップ）</button>
  <button class="btn" data-act="import">バックアップを読み込む</button>
  <button class="btn shu" data-act="reset">最初からやり直す（全消去）</button>
 </div>
 <div class="note">進み具合（判子・苦手・連続正解）はこの端末のブラウザに保存されます。Safariの履歴やWebサイトデータを消すと消えるので、ときどき書き出しておいてください。書き出したファイルは「ファイル」アプリに保存できます。<br><br>ホーム画面に追加：Safariの共有ボタン →「ホーム画面に追加」。</div>`;
}
function exportData(){
 const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='kobun-training-'+new Date().toISOString().slice(0,10)+'.json';
 document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
document.getElementById('imp').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o.cleared!=='object'||typeof o.weak!=='object')throw 0;
  S={cleared:o.cleared,weak:o.weak,streak:o.streak|0,best:o.best|0};save();renderHome();notice('読み込みました');}
  catch(err){notice('このファイルは読み込めません');}};
 r.readAsText(f);e.target.value='';
});

/* ====== 確認ダイアログ（アプリ内） ====== */
const dlg=document.getElementById('dlg');
function ask(msg,okLabel,onOk,cancelLabel){
 dlg.querySelector('.msg').innerHTML=msg;
 const row=dlg.querySelector('.row');row.innerHTML='';
 if(cancelLabel!==null){const c=document.createElement('button');c.className='btn';c.textContent=cancelLabel||'やめない';c.onclick=()=>dlg.classList.remove('on');row.appendChild(c);}
 const o=document.createElement('button');o.className='btn primary';o.textContent=okLabel;o.onclick=()=>{dlg.classList.remove('on');onOk&&onOk();};row.appendChild(o);
 dlg.classList.add('on');
}
function notice(msg){ask(msg,'OK',null,null);}

/* ====== 操作 ====== */
app.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 const a=b.dataset.act;
 if(a==='type')renderType(+b.dataset.i);
 else if(a==='home')renderHome();
 else if(a==='start')startSession(b.dataset.m);
 else if(a==='review')startReview();
 else if(a==='ch')choose(+b.dataset.i);
 else if(a==='next')next();
 else if(a==='resume'){Q.inter=false;prep();renderQuiz();}
 else if(a==='tr'){Q.st.showTr=true;renderQuiz();}
 else if(a==='quit'){const rv=Q.review;ask('やめてメニューに戻りますか？<br><small>この回の途中経過は消えます</small>','戻る',()=>{Q=null;fx.innerHTML='';rv?renderHome():renderType(curType);},'続ける');}
 else if(a==='totype')renderType(curType);
 else if(a==='settings')renderSettings();
 else if(a==='export')exportData();
 else if(a==='import')document.getElementById('imp').click();
 else if(a==='reset'){ask('判子・苦手・記録をすべて消します。よろしいですか？','消す',()=>{S={cleared:{},weak:{},streak:0,best:0};save();renderHome();},'やめる');}
});
fx.addEventListener('animationend',()=>{fx.innerHTML='';},true);

load();renderHome();

</script>
